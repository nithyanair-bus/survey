<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Discovery Survey — High School Journey Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6">

    <div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-xl shadow-md overflow-hidden">
        <header class="bg-blue-900 text-white p-6">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-widest text-blue-300">Stakeholder Group: Parents</span>
                <span class="bg-blue-700 text-blue-200 text-xs px-2.5 py-1 rounded-full">Target: 4–5 Responses</span>
            </div>
            <h1 class="text-xl font-bold mt-2">Parent Feedback & Value Metrics Survey</h1>
            <p class="text-xs text-blue-200 mt-1">Evaluating Parent View, anxiety reduction, and pilot willingness-to-pay.</p>
        </header>

        <form id="parent-survey" class="p-6 space-y-6" onsubmit="calculateParentMetrics(event)">
            
            <!-- Metric 1: Current Anxiety / Friction Level -->
            <div>
                <label class="block text-sm font-semibold text-slate-800 mb-1">
                    1. How anxious do you feel about tracking your child's high school deadlines and college prep?
                </label>
                <select name="anxiety_level" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500">
                    <option value="">Select option...</option>
                    <option value="5">Extremely Anxious — Constantly worried about missed deadlines</option>
                    <option value="4">Moderately Anxious — Hard to keep up with school updates</option>
                    <option value="3">Neutral — We manage, but it takes effort</option>
                    <option value="1">Not Anxious — My child manages everything independently</option>
                </select>
            </div>

            <!-- Metric 2: Parent View Utility -->
            <div>
                <label class="block text-sm font-semibold text-slate-800 mb-1">
                    2. After reviewing the Parent Dashboard (Screen 7), how valuable is having high-level GPA, volunteer, and deadline visibility?
                </label>
                <div class="grid grid-cols-4 gap-2 text-center text-xs">
                    <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="parent_view_score" value="1" required class="block mx-auto mb-1"> Not Valuable
                    </label>
                    <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="parent_view_score" value="2" class="block mx-auto mb-1"> Somewhat
                    </label>
                    <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="parent_view_score" value="4" class="block mx-auto mb-1"> Very Helpful
                    </label>
                    <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="parent_view_score" value="5" class="block mx-auto mb-1"> Essential
                    </label>
                </div>
            </div>

            <!-- Metric 3: Most Resonant Feature -->
            <div>
                <label class="block text-sm font-semibold text-slate-800 mb-1">
                    3. Which feature from the prototype would give you the most peace of mind?
                </label>
                <select name="favorite_feature" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500">
                    <option value="">Select feature...</option>
                    <option value="Roadmap">4-Year Strategic Roadmap (Screen 2)</option>
                    <option value="ParentView">Parent Summary & Volunteer Verifier (Screen 7)</option>
                    <option value="OpportunityTracker">Curated Summer Opportunities/Competitions (Screen 5)</option>
                    <option value="AICoach">24/7 AI Student Coach (Screen 6)</option>
                </select>
            </div>

            <!-- Metric 4: Willingness-to-Pay (WTP) -->
            <div>
                <label class="block text-sm font-semibold text-slate-800 mb-1">
                    4. What is a fair monthly price for this all-in-one high school planning system?
                </label>
                <div class="grid grid-cols-4 gap-2 text-center text-xs">
                    <label class="border rounded-lg p-2.5 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="wtp" value="0" required class="block mx-auto mb-1"> Free Only
                    </label>
                    <label class="border rounded-lg p-2.5 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="wtp" value="10" class="block mx-auto mb-1"> $10 / month
                    </label>
                    <label class="border rounded-lg p-2.5 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="wtp" value="25" class="block mx-auto mb-1"> $25 / month
                    </label>
                    <label class="border rounded-lg p-2.5 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="wtp" value="50" class="block mx-auto mb-1"> $50+ / month
                    </label>
                </div>
            </div>

            <!-- Metric 5: Pilot Conversion -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <label class="block text-sm font-semibold text-blue-900 mb-1">
                    5. Would your family be interested in joining our 2-week Concierge Pilot cohort (Google Sheet + Weekly Digest)?
                </label>
                <div class="flex items-center space-x-6 text-xs mt-2">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="pilot_signup" value="Yes" required class="text-blue-600">
                        <span class="font-bold text-slate-800">Yes, sign us up!</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="pilot_signup" value="Maybe" class="text-blue-600">
                        <span>Maybe (Need more details)</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="pilot_signup" value="No" class="text-blue-600">
                        <span>No thanks</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-xs transition shadow">
                Submit Parent Response & Log Metrics
            </button>
        </form>

        <!-- Dynamic Output Box -->
        <div id="parent-results" class="hidden p-6 bg-slate-900 text-white border-t border-slate-800 text-xs space-y-2">
            <h3 class="font-bold text-blue-400 text-sm flex items-center space-x-2">
                <i class="fa-solid fa-chart-pie"></i><span>Recorded Metric Summary</span>
            </h3>
            <p id="metric-summary-text"></p>
        </div>
    </div>

    <script>
        function calculateParentMetrics(e) {
            e.preventDefault();
            const form = new FormData(e.target);
            const wtp = form.get('wtp');
            const pilot = form.get('pilot_signup');
            const feature = form.get('favorite_feature');

            document.getElementById('parent-results').classList.remove('hidden');
            document.getElementById('metric-summary-text').innerHTML = `
                • <strong>Target Fit Score:</strong> High Value Recorded<br>
                • <strong>Willingness to Pay (WTP):</strong> $${wtp}/month<br>
                • <strong>Top Feature Preference:</strong> ${feature}<br>
                • <strong>Concierge Pilot Interest:</strong> ${pilot}
            `;
        }
    </script>
</body>
</html>
